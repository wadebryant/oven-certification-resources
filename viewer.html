<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#006491">
  <title>PDF Viewer | Oven Certification Resources</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="viewer.css?v=20260814-pinch">
</head>
<body class="viewer-body">
  <header class="viewer-toolbar">
    <a class="viewer-back" href="index.html">← Resources</a>
    <div class="viewer-title-wrap">
      <strong id="viewerTitle">PDF</strong>
      <span id="pageStatus">Loading…</span>
    </div>
    <div class="viewer-controls">
      <button id="prevPage" type="button" aria-label="Previous page">‹</button>
      <button id="nextPage" type="button" aria-label="Next page">›</button>
    </div>
  </header>
  <main id="pdfViewer" class="pdf-viewer" aria-live="polite">
    <div id="viewerLoading" class="viewer-loading">Loading PDF…</div>
  </main>
  <div id="viewerError" class="viewer-error" hidden>
    <strong>Unable to display this PDF.</strong>
    <p>Please return to Resources and try again.</p>
  </div>
  <script type="module" src="viewer.js?v=20260814-pinch"></script>
</body>
</html>
